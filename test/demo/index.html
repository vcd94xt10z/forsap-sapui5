<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>forsap Demo</title>

    <style>
        html,
        body,
        #content {
            width: 100%;
            height: 100%;
            margin: 0;
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge"
        data-sap-ui-resourceroots='{
            "demo": "/test-resources/demo"
        }'>
    </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require([
                "sap/ui/core/ComponentContainer"
            ], function (ComponentContainer) {
                new ComponentContainer({
                    name: "demo",
                    async: true,
                    manifest: true,
                    width: "100%",
                    height: "100%"
                }).placeAt("content");
            });
        });
    </script>
</head>

<body
    class="sapUiBody"
    id="content">
</body>
</html>
